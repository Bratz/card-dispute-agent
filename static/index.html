<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disputes Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{--bg:#F6F7F8;--surface:#FFFFFF;--surface-2:#F0F2F4;--raise:#FAFBFC;--ink:#1A1D21;--muted:#5C636B;--faint:#98A0A8;
    --line:#E2E5E8;--line-2:#EDEFF1;--accent:#20386A;--accent-2:#2C4C8C;--accent-soft:#EAEEF4;--alert:#A6373B;--ok:#2E6B4E;--warn:#8A6300;--r:6px;--rs:4px}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#14171B;--surface:#1B1F25;--surface-2:#242A31;--raise:#1F242A;--ink:#E6E9EC;--muted:#9AA2AA;--faint:#697079;--line:#2A2F36;--line-2:#23282E;--accent:#8FA9D8;--accent-2:#A9BEE4;--accent-soft:#1E2A40;--alert:#D98A8A;--ok:#6FBF95;--warn:#D6A94A}}
  :root[data-theme=dark]{--bg:#14171B;--surface:#1B1F25;--surface-2:#242A31;--raise:#1F242A;--ink:#E6E9EC;--muted:#9AA2AA;--faint:#697079;--line:#2A2F36;--line-2:#23282E;--accent:#8FA9D8;--accent-2:#A9BEE4;--accent-soft:#1E2A40;--alert:#D98A8A;--ok:#6FBF95;--warn:#D6A94A}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13.5px;line-height:1.5}
  .mono{font-family:"IBM Plex Mono",monospace}button{font-family:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  a{color:inherit;text-decoration:none}
  .app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
  @media(max-width:820px){.app{grid-template-columns:1fr}.side{display:none}}
  .side{background:var(--surface);border-right:1px solid var(--line);padding:14px 0;position:sticky;top:0;height:100vh}
  .side .logo{padding:2px 18px 14px;font-weight:600;font-size:15px;border-bottom:1px solid var(--line-2);margin-bottom:8px}
  .side .logo small{display:block;font-weight:400;font-size:11px;color:var(--faint);margin-top:2px}
  .side nav a{display:flex;align-items:center;gap:9px;padding:8px 18px;color:var(--muted);font-size:13px;border-left:2px solid transparent;cursor:pointer}
  .side nav a:hover{color:var(--ink);background:var(--surface-2)}
  .side nav a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft);font-weight:500}
  .side nav .grp{padding:14px 18px 5px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint)}
  .side nav a .b{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:20px;padding:0 6px;color:var(--muted)}
  .top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding:9px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .top .crumb{font-size:13px;color:var(--muted)}.top .crumb b{color:var(--ink);font-weight:600}
  .top .m{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}.sp{flex:1}
  select,input{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:var(--rs);background:var(--surface);color:var(--ink);padding:5px 7px}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--rs);padding:6px 12px;font-size:13px;font-weight:500}
  .btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:transparent;color:#fff}.btn.sm{padding:4px 9px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:default}
  :root[data-theme=dark] .btn.pri,:root:not([data-theme=light]) .btn.pri{color:#14171B}
  @media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{color:#14171B}}
  .view{padding:18px 22px 44px;max-width:1120px}
  h1{font-size:17px;font-weight:600;margin:0 0 3px}.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
  .panel>header{display:flex;gap:8px;align-items:center;padding:9px 13px;border-bottom:1px solid var(--line-2);background:var(--raise)}
  .panel>header h2{margin:0;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
  .panel>header .x{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint)}
  .panel .body{padding:12px 13px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);padding:8px 12px;border-bottom:1px solid var(--line)}
  td{padding:8px 12px;border-bottom:1px solid var(--line-2)}tr:last-child td{border-bottom:0}
  tr.row{cursor:pointer}tr.row:hover td{background:var(--surface-2)}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .badge{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .badge.hi{color:var(--alert);border-color:var(--alert)}.badge.okb{color:var(--ok);border-color:var(--ok)}
  .two{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:5px 16px;font-size:13px}
  .kv dt{color:var(--faint);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;align-self:center}.kv dd{margin:0}
  .chip{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;padding:2px 7px;border-radius:var(--rs);background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
  .chip.tok{background:transparent;border-style:dashed}.chip.new{background:transparent;border-color:var(--alert);color:var(--alert)}
  .item{border:1px solid var(--line);border-radius:var(--rs);padding:8px 11px;margin-bottom:8px}.item:last-child{margin-bottom:0}
  .item .t{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:3px}.item .k{font-weight:600;font-size:12.5px}
  .item .w{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}.item .p{font-size:12px;color:var(--muted);word-break:break-word}
  .tl{position:relative;padding-left:15px}.tl::before{content:"";position:absolute;left:3px;top:5px;bottom:5px;width:1px;background:var(--line)}
  .tl .e{position:relative;padding:5px 0 5px 6px;font-size:13px}.tl .e::before{content:"";position:absolute;left:-15px;top:9px;width:7px;height:7px;border-radius:50%;background:var(--surface);border:1.5px solid var(--accent)}
  .tl .e .d{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint)}
  .pos{margin-bottom:9px}.pos .r{display:flex;gap:8px;align-items:center}.pos .s{flex:1;font-size:13px}.pos .pc{font-family:"IBM Plex Mono",monospace;font-size:12px;width:34px;text-align:right}
  .track{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:4px}.fill{height:100%;background:var(--accent-2);border-radius:3px;transition:width .9s cubic-bezier(.2,.7,.2,1)}
  .pos.lead .fill{background:var(--accent)}
  .exc{display:flex;gap:8px;font-size:12.5px;padding:7px 10px;border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--rs);margin-bottom:7px}.exc:last-child{margin-bottom:0}
  .exc.contradiction{border-left-color:var(--alert)}.exc.contradiction .tag{color:var(--alert)}
  .exc.missing{border-left-color:var(--warn)}.exc.missing .tag{color:var(--warn)}
  .exc.stale{border-left-color:var(--faint)}.exc.resolved{opacity:.5;text-decoration:line-through}
  .exc .tag{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;color:var(--faint)}
  .rec{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--rs);padding:11px 12px}
  .rec .h{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin-bottom:4px}
  .rec .w{font-size:13.5px;margin-bottom:10px}.rec .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .gate{font-size:11px;color:var(--faint);margin-top:9px}.gate .ok{color:var(--ok);font-weight:600}
  .liab .v{font-size:18px;font-weight:600;color:var(--muted)}.liab.set .v{color:var(--ink)}.liab .n{font-size:11px;color:var(--muted);margin-top:5px}
  .decbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .aud{max-height:240px;overflow:auto}.aud .a{display:grid;grid-template-columns:auto 1fr auto;gap:8px;font-size:12px;padding:6px 2px;border-bottom:1px solid var(--line-2)}
  .aud .a:last-child{border-bottom:0}.aud .ac{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--accent)}
  .aud .rr{color:var(--muted);display:block;font-size:11px}.aud .tm{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--faint);white-space:nowrap}
  .actionbar{position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .note{font-size:12px;color:var(--muted);flex:1;min-width:180px}
  .banner{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--rs);padding:11px 13px;font-size:13px;color:var(--muted);margin-bottom:12px}
  .banner b{color:var(--ink)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  @media(max-width:640px){.kpis{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .kpi .v{font-size:24px;font-weight:600;margin-top:4px}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
  .tabs a{padding:8px 14px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
  .tabs a:hover{color:var(--ink)}.tabs a.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
  .toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:40}
  .toast{background:var(--surface);border:1px solid var(--line);font-size:12.5px;padding:9px 13px;border-radius:var(--rs);max-width:320px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/vendor/htm.js"></script>
<script src="/app.js"></script>
</body></html>
